amily:system-ui,sans-serif}.reader .row{font-family:system-ui,sans-serif}@media(max-width:520px){.reader{padding:14mm 11mm;min-height:210mm;border-radius:4px}.reader p{font-size:17px;line-height:1.7}}.reader.dark{background:#211b24;color:#f9edf4}.reader.dark h1{color:#f4cddd}.reader.sepia{background:#f1e4ce;color:#51412e}.progress{height:5px;border-radius:8px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;background:var(--pink2)}.hide{display:none!important}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--pink);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:var(--shadow)}.chapterbtn{display:block;width:100%;text-align:left;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);margin:8px 0}.back{background:none;color:var(--pink);font-weight:700;padding:0 0 12px}.search{margin-top:16px}.smallbtn{background:var(--panel2);color:var(--pink);border:1px solid var(--line);padding:9px 12px;border-radius:12px}

const genres=['Романтика','Фэнтези','Детектив','Приключения','Драма'];
const books=[{"id":1,"title":"Между строк","author":"YourDreamReader Studio","genre":"Романтика","emoji":"🌷","tone":"","desc":"История о случайной встрече, письмах и чувствах, которые рождаются между строк.","chapters":[["Глава 1. Незнакомка в кафе","Сначала всё выглядело случайностью. Потом Алина замечает книгу с запиской, которая будто адресована именно ей.. Она поняла, что простого ответа не будет, но отступать уже не хотелось. Герой записал важную деталь, чтобы не доверять одной лишь памяти, и впервые увидел в происходящем общий рисунок.\n\nВ этой главе незнакомка в кафе становится поворотной точкой пути. Герой возвращается к деталям предыдущих событий, сопоставляет их и замечает то, что раньше ускользало от внимания. Вместо поспешного ответа он выбирает следующий конкретный шаг: поговорить с тем, кому ещё можно доверять, проверить найденную улику и не скрывать собственные сомнения. Когда день заканчивается, перед ним уже не прежняя развилка, а дорога с понятной целью. И хотя впереди остаётся немало неизвестного, теперь есть причина идти дальше.\n\nОн/она бережно сохраняет найденную деталь — незнакомка в кафе — и обещает себе вернуться к ней, если новые события начнут противоречить друг другу. Так постепенно складывается история, в которой важны не только ответы, но и люди, готовые разделить ответственность за выбор."],["Глава 2. Записка между страниц","Утро встретило героя прохладным ветром. В воздухе чувствовался запах мокрой земли и старой бумаги. Она приходит по указанному адресу и встречает человека с таким же экземпляром.. Впервые за долгое время он позволил себе поверить, что всё ещё можно изменить. Решение пришлось принять до наступления темноты, иначе следующая возможность могла исчезнуть.\n\nВ этой главе записка между страниц становится поворотной точкой пути. Герой возвращается к деталям предыдущих событий, сопоставляет их и замечает то, что раньше ускользало от внимания. Вместо поспешного ответа он выбирает следующий конкретный шаг: поговорить с тем, кому ещё можно доверять, проверить найденную улику и не скрывать собственные сомнения. Когда день заканчивается, перед ним уже не прежняя развилка, а дорога с понятной целью. И хотя впереди остаётся немало неизвестного, теперь есть причина идти дальше.\n\nОн/она бережно сохраняет найденную деталь — записка между страниц — и обещает себе вернуться к ней, если новые события начнут противоречить друг другу. Так постепенно складывается история, в которой важны не только ответы, но и люди, готовые разделить ответственность за выбор."],["Глава 3. Встреча в шесть","Они остановились и прислушались к тишине. Незнакомец объясняет, что записки оставляет читатель, ищущий продолжение истории.. Важнее самой находки оказалось то, что теперь им предстояло решить вместе. Даже привычные вещи теперь казались частью загадки; каждый следующий шаг требовал смелости и доверия.\n\nВ этой главе встреча в шесть становится поворотной точкой пути. Герой возвращается к деталям предыдущих событий, сопоставляет их и замечает то, что раньше ускользало от внимания. Вместо поспешного ответа он выбирает следующий конкретный шаг: поговорить с тем, кому ещё можно доверять, проверить найденную улику и не скрывать собственные сомнения. Когда день заканчивается, перед ним уже не прежняя развилка, а дорога с понятной целью. И хотя впереди остаётся немало неизвестного, теперь есть причина идти дальше.\n\nОн/она бережно сохраняет найденную деталь — встреча в шесть — и обещает себе вернуться к ней, если новые события начнут противоречить друг другу. Так постепенно складывается история, в которой важны не только ответы, но и люди, готовые разделить ответственность за выбор."],["Глава 4. Книжный магазин","К вечеру За окном шумел дождь, отбивая неровный ритм. Между страницами обнаруживается новая записка.. Это открытие одновременно пугало и обнадёживало: прошлое больше не казалось закрытой дверью. За окном менялся свет, но никто не спешил уходить: теперь у них была зацепка, которую нельзя было оставить без ответа.\n\nВ этой главе книжный магазин становится поворотной точкой пути. Герой возвращается к деталям предыдущих событий, сопоставляет их и замечает то, что раньше ускользало от внимания. Вместо поспешного ответа он выбирает следующий конкретный шаг: поговорить с тем, кому ещё можно доверять, проверить найденную улику и не скрывать собственные сомнения. Когда день заканчивается, перед ним уже не прежняя развилка, а дорога с понятной целью. И хотя впереди остаётся немало неизвестного, теперь есть причина идти дальше.\n\nОн/она бережно сохраняет найденную деталь — книжный магазин — и обещает себе вернуться к ней, если новые события начнут противоречить друг другу. Так постепенно складывается история, в которой важны не только ответы, но и люди, готовые разделить ответственность за выбор."],["Глава 5. Имя на форзаце","Сначала всё выглядело случайностью. Потом Разговор случайно касается детства героев.. Она поняла, что простого ответа не будет, но отступать уже не хотелось. Герой записал важную деталь, чтобы не доверять одной лишь памяти, и впервые увидел в происходящем общий рисунок.\n\nВ этой главе имя на форзаце становится поворотной точкой пути. Герой возвращается к деталям предыдущих событий, сопоставляет их и замечает то, что раньше ускользало от внимания. Вместо поспешного ответа он выбирает следующий конкретный шаг: поговорить с тем, кому ещё можно доверять, проверить найденную улику и не скрывать собственные сомнения. Когда день заканчивается, перед ним уже не прежняя развилка, а дорога с понятной целью. И хотя впереди остаётся немало неизвестного, теперь есть причина идти дальше.\n\nОн/она бережно сохраняет найденную деталь — имя на форзаце — и обещает себе вернуться к ней, если новые события начнут противоречить друг другу. Так постепенно складывается история, в которой важны не только ответы, но и люди, готовые разделить ответственность за выбор."],["Глава 6. Дождь над набережной","Утро встретило героя прохладным ветром. В воздухе чувствовался запах мокрой зем function save(){try{localStorage.setItem('ydr',JSON.stringify(state))}catch(e){toast('Не удалось сохранить данные: память устройства заполнена')}}function el(id){return document.getElementById(id)}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1900)}
function setup(){el('view').innerHTML=`<div class="eyebrow">Добро пожаловать</div><div class="hero"><div style="font-size:36px">♡</div><h1>Твоя следующая любимая история</h1><p>Место, где оживают миры, чувства и воображение.</p><button class="pillbtn" onclick="page('library')">Открыть библиотеку →</button></div><div class="card"><h2>Настроим твою читальню</h2><p class="muted">Имя автора или псевдоним</p><input class="field" id="onname" placeholder="Например, Без имени автора" value="${esc(state.name)}"><p class="muted">Язык первого запуска</p><label class="choice"><input type="radio" name="lang" value="Русский" ${state.lang==='Русский'?'checked':''}>Русский</label><p class="muted">Язык приложения: русский (другие переводы пока не добавлены).</p><p class="muted">В библиотеке доступны семь новелл по 30 глав каждая. Новые истории и продолжения можно добавлять в следующих обновлениях.</p><button class="primary" onclick="finishSetup()">Утвердить и продолжить 💗</button></div><p class="muted">Можно изменить настройки в любой момент.</p>`}
function finishSetup(){state.name=el('onname').value.trim()||'Без имени автора';state.lang='Русский';state.pilot=true;state.done=true;save();page('home');toast('Твоя читальня готова 💗')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function page(p){activePage=p;currentView='page';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(!state.done&&p!=='settings'){setup();return}if(p==='home')home();if(p==='library')library();if(p==='favorites')favorites();if(p==='settings')settings();if(p==='profile')profile();applyStyle()}
function bookCard(b){let prog=state.progress[b.id]||0;return `<article class="book" onclick="detail(${b.id})"><div class="cover ${b.tone}">${b.emoji}</div><div class="bookinfo"><h3>${b.title}</h3><small>${b.genre} · ${b.chapters.length} главы</small><div class="tag">${prog>=b.chapters.length?'Прочитано':prog?`Читается · ${prog}/${b.chapters.length}`:'Новая история'}</div></div></article>`}
function home(){el('view').innerHTML=`<div class="eyebrow">${esc(state.name||'Твоя читальня')}</div><div class="hero"><div class="eyebrow" style="color:#8b6078">YOUR DREAM READER</div><h1>Между строк — целый мир</h1><p>Выбирай настроение, открывай новую историю и сохраняй любимые моменты.</p><button class="pillbtn" onclick="page('library')">Выбрать историю →</button></div><div class="sectionhead"><h2>Жанры</h2><span class="muted">7 историй</span></div><div class="chips">${['Все',...genres].map(g=>`<button class="chip" onclick="filter='${g}';page('library')">${g}</button>`).join('')}</div><div class="sectionhead"><h2>Продолжить чтение</h2><button class="smallbtn" onclick="resumeReading()">Продолжить →</button></div><div class="sectionhead"><h2>Истории для тебя</h2><button class="smallbtn" onclick="page('library')">Все →</button></div><div class="grid">${books.slice(0,4).map(bookCard).join('')}</div>`}
function library(){el('view').innerHTML=`<div class="eyebrow">Коллекция историй</div><h1 style="margin:4px 0">Библиотека</h1><input class="field search" id="q" placeholder="⌕  Найти историю или жанр" oninput="renderBooks()"><div class="chips">${['Все',...genres].map(g=>`<button class="chip ${filter===g?'active':''}" onclick="filter='${g}';library()">${g}</button>`).join('')}</div><div class="sectionhead"><h2>${filter==='Все'?'Все истории':filter}</h2><span class="muted">${books.filter(b=>filter==='Все'||b.genre===filter).length}</span></div><div class="grid" id="bookgrid">${books.filter(b=>filter==='Все'||b.genre===filter).map(bookCard).join('')}</div>`}
function renderBooks(){let q=el('q').value.toLowerCase();el('bookgrid').innerHTML=books.filter(b=>(filter==='Все'||b.genre===filter)&&(b.title+' '+b.genre+' '+b.desc).toLowerCase().includes(q)).map(bookCard).join('')||'<div class="empty">Ничего не найдено</div>'}
function favorites(){let a=books.filter(b=>state.favorites.includes(b.id));el('view').innerHTML=`<div class="eyebrow">Твоя коллекция</div><h1>Избранное ♡</h1>${a.length?`<div class="grid">${a.map(bookCard).join('')}</div>`:'<div class="empty">♡<p>Здесь будут истории, которые ты полюбишь.</p><button class="smallbtn" onclick="page(\'library\')">Найти историю</button></div>'}`}
function detail(id){currentBook=books.find(b=>b.id===id);if(!currentBook)return;currentView='detail';returnPage=activePage;let b=currentBook;el('view').innerHTML=`<button class="back" onclick="page('${returnPage}')">← Назад</button><div class="hero" style="text-align:center"><div style="font-size:65px">${b.emoji}</div><div class="eyebrow" style="color:#8b6078">${b.genre}</div><h1>${b.title}</h1><p style="margin:auto">${b.desc}</p></div><div class="row between" style="margin:18px 0"><span class="muted">${b.chapters.length} глав · завершённая новелла</span><button class="smallbtn" onclick="toggleFav(${b.id})">${state.favorites.includes(b.id)?'♥ В избранном':'♡ В избранное'}</button></div><div class="progress"><i style="width:${(state.progress[b.id]||0)/b.chapters.length*100}%"></i></div><div class="sectionhead"><h2>Содержание</h2></div>${b.chapters.map((c,i)=>`<button class="chapterbtn" onclick="read(${b.id},${i})"><div class="row between"><b>${c[0]}</b><span>→</span></div><small class="muted">${i<(state.progress[b.id]||0)?'Прочитано':'Открыть главу'}</small></button>`).join('')}`}
function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();toast(state.favorites.includes(id)?'Добавлено в избранное':'Удалено из избранного');detail(id)}
let readerPage=0;
function splitIntoPages(text,max=1350){const paragraphs=String(text||'').split(/\n\s*\n/);const pages=[];let pageText='';for(const para of paragraphs){let remaining=para.trim();while(remaining.length>max){let cut=remaining.lastIndexOf(' ',max);if(cut<max*.55)cut=max;const part=remaining.slice(0,cut).trim();if(pageText){pages.push(pageText);pageText=''}pages.push(part);remaining=remaining.slice(cut).trim()}if((pageText+'\n\n'+remaining).trim().length>max&&pageText){pages.push(pageText);pageText=remaining}else pageText=[pageText,remaining].filter(Boolean).join('\n\n')}if(pageText)pages.push(pageText);return pages.length?pages:[''];}
function chapterArt(b,n){const palettes=[['#f4d8e5','#9e718e'],['#d7d5f2','#6e76a9'],['#f2ddc7','#a66f59'],['#cde5db','#668f80'],['#e8d5c7','#997a72'],['#c9dce9','#648ba2'],['#d8c8ec','#79639d']];const [a,z]=palettes[(b.id-1)%palettes.length];const symbols=['🌷','✨','🔎','🧭','🕯️','🌧️','🌌'];const motifs=['Встреча, изменившая всё','Там, где начинается волшебство','След ведёт дальше','За линией горизонта','Тихие моменты памяти','Город под дождём','Между звёзд'];return `<div class="reader-illustration" style="--art1:${a};--art2:${z}" role="img" aria-label="Иллюстрация к главе ${n+1}"><svg viewBox="0 0 600 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path d="M0 170 Q100 115 210 170 T430 160 T650 165 V240 H0Z" fill="#ffffff" opacity=".23"/><path d="M0 190 Q140 140 270 188 T600 180 V240 H0Z" fill="#39263f" opacity=".18"/><circle cx="470" cy="48" r="28" fill="#fff" opacity=".48"/><path d="M55 220 Q110 130 165 220 M90 220 Q160 95 220 220" stroke="#fff" stroke-width="5" opacity=".35" fill="none" stroke-linecap="round"/></svg><span class="art-symbol">${symbols[(b.id-1)%symbols.length]}</span></div><div class="eyebrow" style="color:#a47e92;text-align:center">${motifs[(b.id-1)%motifs.length]} · эпизод ${n+1}</div>`}
function renderReader(){const b=currentBook,n=currentChapter;if(!b)return;const c=b.chapters[n];const pages=splitIntoPages(c[1]);readerPage=Math.max(0,Math.min(readerPage,pages.length-1));const pageText=pages[readerPage];const isFirst=readerPage===0;const total=pages.length;el('view').innerHTML=`<button class="back" onclick="detail(${b.id})">← К содержанию</button><div class="row between"><small class="muted">${esc(b.title)}</small><small class="muted">Глава ${n+1} из ${b.chapters.length}</small></div><div class="progress" style="margin:10px 0 14px"><i style="width:${((readerPage+1)/total)*100}%"></i></div><article id="readerSurface" class="reader ${state.style==='dark'?'dark':state.style==='sepia'?'sepia':''}" style="font-size:${state.font}px"><div class="reader-page">${isFirst?chapterArt(b,n):''}<div class="eyebrow" style="color:#bd83a1">${esc(b.genre)}</div><h1>${esc(c[0])}</h1>${pageText.split(/\n\s*\n/).map(x=>`<p>${esc(x)}</p>`).join('')}</div><div class="reader-footer">${readerPage+1} / ${total} · YourDreamReader</div></article><p class="reader-hint">← Свайпни вправо или влево, чтобы перелистнуть страницу →</p>`;const surface=el('readerSurface');let sx=0,sy=0;surface.addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY}},{passive:true});surface.addEventListener('touchend',e=>{if(!e.changedTouches.length)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.25){if(dx<0)flipPage(1);else flipPage(-1)}},{passive:true});surface.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'){sx=e.clientX;sy=e.clientY}},{passive:true});surface.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'){const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)>80&&Math.abs(dx)>Math.abs(dy)*1.3)flipPage(dx<0?1:-1)}},{passive:true});state.lastChapter[b.id]=n;state.lastBook=b.id;save()}
function read(id,n){currentView='reader';currentBook=books.find(b=>b.id===id);if(!currentBook||!Number.isInteger(n)||n<0||n>=currentBook.chapters.length)return;currentChapter=n;readerPage=0;renderReader()}
function flipPage(direction){if(!currentBook)return;const pages=splitIntoPages(currentBook.chapters[currentChapter][1]);if(direction>0){if(readerPage<pages.length-1){readerPage++;renderReader();return}if(currentChapter<currentBook.chapters.length-1){advanceChapter(currentBook.id,currentChapter);return}finishBook(currentBook.id)}else{if(readerPage>0){readerPage--;renderReader();return}if(currentChapter>0){currentChapter--;readerPage=splitIntoPages(currentBook.chapters[currentChapter][1]).length-1;renderReader();return}toast('Это начало истории')}}
function advanceChapter(id,n){state.progress[id]=Math.max(state.progress[id]||0,n+1);state.lastChapter[id]=n+1;save();read(id,n+1)}function finishBook(id){state.progress[id]=currentBook.chapters.length;state.lastChapter[id]=currentBook.chapters.length-1;save();toast('История прочитана! ♡');detail(id)}function resumeReading(){let id=Number(state.lastBook);if(!books.some(b=>b.id===id)){let ids=Object.keys(state.lastChapter);id=Number(ids[ids.length-1])}let book=books.find(b=>b.id===id);if(!book){page('library');toast('Выбери историю, чтобы начать чтение');return}let chapter=Number(state.lastChapter[id]);if(!Number.isInteger(chapter)||chapter<0||chapter>=book.chapters.length)chapter=0;read(id,chapter)}
function settings(){el('view').innerHTML=`<div class="eyebrow">Твоя атмосфера</div><h1>Настройки</h1><div class="card"><h3>Оформление приложения</h3><label class="choice"><input type="radio" name="style" value="pink" ${state.style==='pink'?'checked':''} onchange="setStyle(this.value)">Цветы и лепестки · розовый</label><label class="choice"><input type="radio" name="style" value="gradient" ${state.style==='gradient'?'checked':''} onchange="setStyle(this.value)">Нежный градиент</label><label class="choice"><input type="radio" name="style" value="dark" ${state.style==='dark'?'checked':''} onchange="setStyle(this.value)">Ночной монотонный</label></div><div class="card"><h3>Читалка</h3><p class="muted">Размер текста: <b id="fontval">${state.font}px</b></p><input type="range" min="16" max="26" value="${state.font}" style="width:100%;accent-color:#e9aeca" oninput="state.font=+this.value;el('fontval').textContent=this.value+'px';save()"><p class="muted">Предпросмотр</p><div class="reader" style="min-height:120px"><b>YourDreamReader</b><p style="font-size:${state.font}px">Твоя следующая любимая история ♡</p></div></div><div class="card"><h3>Язык приложения</h3><p class="muted">Сейчас доступен русский интерфейс и русскоязычные истории. Переключение на другие языки появится после добавления переводов.</p></div><div class="card"><h3>Данные приложения</h3><p class="muted">Сохрани резервную копию прогресса и избранного или восстанови её на этом устройстве.</p><button class="smallbtn" onclick="exportData()">Экспортировать данные</button><textarea id="backupdata" class="field" rows="3" placeholder="Для восстановления вставь сюда JSON-файл резервной копии"></textarea><button class="smallbtn" onclick="importData()">Восстановить копию</button></div><div class="card"><h3>Первоначальная настройка</h3><button class="smallbtn" onclick="restartSetup()">Изменить имя и предпочтения</button></div><button class="primary" onclick="toast('Настройки сохранены 💗')">Сохранить настройки</button>`}
function setStyle(v){state.style=v;save();applyStyle();toast('Оформление изменено')}function applyStyle(){document.body.style.background=state.style==='gradient'?'linear-gradient(145deg,#17131a,#332232)':'var(--bg)';document.body.classList.toggle('theme-dark',state.style==='dark')}function exportData(){let t=el('backupdata');t.value=JSON.stringify({app:'YourDreamReader',version:1,data:state},null,2);t.focus();t.select();toast('Резервная копия готова — скопируй текст')}function importData(){try{let x=JSON.parse(el('backupdata').value);let d=x&&x.data&&typeof x.data==='object'?x.data:x;if(!d||typeof d!=='object'||Array.isArray(d))throw new Error('format');let validIds=books.map(b=>b.id);let favorites=Array.isArray(d.favorites)?d.favorites.map(Number).filter(id=>validIds.includes(id)):[];let progress={};if(d.progress&&typeof d.progress==='object'&&!Array.isArray(d.progress)){for(let [key,value] of Object.entries(d.progress)){let id=Number(key),book=books.find(b=>b.id===id),n=Number(value);if(book&&Number.isFinite(n))progress[id]=Math.max(0,Math.min(book.chapters.length,Math.floor(n)))}}let lastChapter={};if(d.lastChapter&&typeof d.lastChapter==='object'&&!Array.isArray(d.lastChapter)){for(let [key,value] of Object.entries(d.lastChapter)){let id=Number(key),book=books.find(b=>b.id===id),n=Number(value);if(book&&Number.isInteger(n)&&n>=0&&n<book.chapters.length)lastChapter[id]=n}}state={...state,name:typeof d.name==='string'?d.name.slice(0,40):state.name,style:['pink','gradient','dark'].includes(d.style)?d.style:state.style,font:Number.isFinite(Number(d.font))?Math.max(16,Math.min(26,Number(d.font))):state.font,favorites:[...new Set(favorites)],progress,lastChapter,lastBook:validIds.includes(Number(d.lastBook))?Number(d.lastBook):Number(Object.keys(lastChapter).pop())||0,done:!!d.done,lang:'Русский'};save();toast('Данные восстановлены');page('home')}catch(e){toast('Не удалось прочитать резервную копию')}}function restartSetup(){if(confirm('Вернуться к первоначальной настройке? Прогресс и избранное сохранятся.')){state.done=false;save();setup()}}
function profile(){el('view').innerHTML=`<div class="eyebrow">Творческая студия</div><h1>Профиль автора</h1><div class="card"><div style="font-size:42px">✦</div><label class="muted" for="profilename">Имя или псевдоним</label><input class="field" id="profilename" maxlength="40" value="${esc(state.name)}"><button class="smallbtn" onclick="saveProfile()">Сохранить имя</button><p class="muted">${state.lang}</p></div><div class="card"><div class="row between"><span>Историй в библиотеке</span><b>${books.length}</b></div><div class="row between"><span>В избранном</span><b>${state.favorites.length}</b></div><div class="row between"><span>Начато историй</span><b>${Object.keys(state.progress).length}</b></div></div><p class="muted">YourDreamReader Studio · версия 1.0.0</p>`}
function saveProfile(){state.name=el('profilename').value.trim()||'Без имени автора';save();toast('Профиль обновлён');profile()}function readerBack(){if(currentView==='reader'&&currentBook){detail(currentBook.id);return true}if(currentView==='detail'){page(returnPage);return true}if(activePage!=='home'){page('home');return true}return false}
if(!state.done){setup()}else{page('home')}
</script></body></html>
