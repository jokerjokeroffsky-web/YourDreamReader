<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#17131a"><title>YourDreamReader Studio</title><style>
:root{--bg:#17131a;--panel:#211b24;--panel2:#2b222d;--text:#fff8fc;--muted:#b9aab5;--pink:#f4cddd;--pink2:#e9aeca;--ink:#684b5d;--line:#3b303d;--paper:#fff8fb;--shadow:0 12px 32px #0005}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:760px;margin:auto;min-height:100dvh;padding-bottom:86px}.top{position:sticky;top:0;z-index:5;background:#17131aee;backdrop-filter:blur(12px);padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.brand span{color:var(--pink2)}.avatar{width:38px;height:38px;border-radius:50%;background:var(--panel2);color:var(--pink);font-weight:700}.content{padding:18px}.eyebrow{color:var(--pink2);font-size:12px;text-transform:uppercase;letter-spacing:1.6px;font-weight:800}.hero{background:linear-gradient(140deg,#f8dce8,#edbfd4 55%,#dbaac5);color:var(--ink);border-radius:26px;padding:24px;box-shadow:var(--shadow);overflow:hidden}.hero h1{font-size:29px;line-height:1.12;margin:8px 0}.hero p{max-width:390px;margin:8px 0 18px}.pillbtn,.primary{background:var(--paper);color:var(--ink);border-radius:999px;padding:12px 20px;font-weight:800}.primary{background:var(--pink);width:100%;margin-top:12px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}.sectionhead h2{font-size:20px;margin:0}.muted{color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.chip{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 14px;border-radius:999px}.chip.active{background:var(--pink);border-color:var(--pink);color:var(--ink);font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.book{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer}.cover{height:142px;display:flex;align-items:center;justify-content:center;font-size:52px;background:linear-gradient(145deg,#f7d9e6,#c8a7c7)}.cover.c2{background:linear-gradient(145deg,#d9d5f7,#9f9bc8)}.cover.c3{background:linear-gradient(145deg,#f5dfc9,#d99d88)}.cover.c4{background:linear-gradient(145deg,#d1e7df,#8eb7aa)}.bookinfo{padding:12px}.book h3{font-size:15px;line-height:1.25;margin:0 0 5px}.book small{color:var(--muted)}.tag{display:inline-block;background:#f4cddd24;color:var(--pink);border-radius:7px;padding:3px 7px;font-size:11px;margin-top:8px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#211b24f2;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center}.navinner{width:min(760px,100%);display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}.nav button{background:none;color:var(--muted);font-size:12px;display:grid;gap:3px;justify-items:center}.nav button b{font-size:21px}.nav button.active{color:var(--pink)}.field{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;color:var(--text);margin:6px 0 14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;gap:12px}.row.between{justify-content:space-between}.choice{display:flex;gap:10px;align-items:center;padding:11px 0}.choice input{accent-color:#e9aeca;width:18px;height:18px}.reader{background:var(--paper);color:#443541;border-radius:20px;padding:22px;min-height:65vh}.reader h1{color:#684b5d}.reader p{font-family:Georgia,serif;font-size:19px;line-height:1.8}.reader.dark{background:#211b24;color:#f9edf4}.reader.dark h1{color:#f4cddd}.reader.sepia{background:#f1e4ce;color:#51412e}.progress{height:5px;border-radius:8px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;background:var(--pink2)}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--pink);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:700;z-index:20;box-shadow:var(--shadow)}.chapterbtn{display:block;width:100%;text-align:left;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:13px;color:var(--text);margin:8px 0}.back{background:none;color:var(--pink);font-weight:700;padding:0 0 12px}.theme-dark{--bg:#0e0c10;--panel:#17131b;--panel2:#241d29;--text:#fff8fc;--line:#302735}.smallbtn{background:var(--panel2);color:var(--pink);border:1px solid var(--line);padding:9px 12px;border-radius:12px}
</style></head><body><div class="app"><header class="top"><div class="brand">♡ YourDreamReader <span>Studio</span></div><button class="avatar" onclick="page('profile')" aria-label="Профиль">✦</button></header><main id="view" class="content"></main><nav class="nav"><div class="navinner"><button data-page="home" onclick="page('home')"><b>⌂</b>Главная</button><button data-page="library" onclick="page('library')"><b>▤</b>Библиотека</button><button data-page="favorites" onclick="page('favorites')"><b>♡</b>Избранное</button><button data-page="settings" onclick="page('settings')"><b>⚙</b>Настройки</button></div></nav></div><script>
const genres=['Романтика','Фэнтези','Детектив','Приключения','Драма'];
const books=[
{id:1,title:'Между строк',author:'YourDreamReader Studio',genre:'Романтика',emoji:'🌷',tone:'',desc:'История о случайной встрече, письмах и чувствах, которые рождаются между строк.',chapters:[['Глава 1. Незнакомка в кафе','Дождь начался внезапно. Алина спряталась в маленьком кафе на углу и заметила на соседнем столике книгу с загнутой страницей. Между страницами лежала записка: «Если ты это читаешь, значит, мы уже немного знакомы». Она улыбнулась и перевернула лист. На обороте был адрес и время — сегодня, ровно в шесть.'],['Глава 2. Записка','В шесть часов город казался совсем другим. У старого книжного магазина её ждал человек с таким же изданием в руках. Он не стал объяснять записку — только спросил, какую историю она хотела бы прожить сама.'],['Глава 3. Следующая страница','Они шли по мокрым улицам и говорили так, словно продолжали разговор, начатый много лет назад. Алина поняла: иногда новая глава начинается с чужой книги.']]},
{id:2,title:'Сад лунных огней',author:'YourDreamReader Studio',genre:'Фэнтези',emoji:'🌙',tone:'c2',desc:'В саду, который открывается только после полуночи, цветы хранят чужие воспоминания.',chapters:[['Глава 1. Ворота','В полночь на стене старого дома проступила дверь. Мира коснулась холодной ручки — и оказалась в саду, где вместо росы на лепестках мерцали крошечные звёзды.'],['Глава 2. Хранительница','Седая хранительница предупредила: каждый цветок хранит воспоминание, но сорвать можно только одно. Мира искала голос матери, который не слышала с детства.'],['Глава 3. Один огонёк','Самый маленький цветок вспыхнул тёплым светом. Внутри оказалось не прошлое, а обещание: «Не бойся идти дальше».']]},
{id:3,title:'Тайна старого письма',author:'YourDreamReader Studio',genre:'Детектив',emoji:'🗝️',tone:'c3',desc:'Пожелтевшее письмо запускает расследование семейной тайны.',chapters:[['Глава 1. Конверт','На чердаке Ника нашла конверт без адреса. Внутри было всего три строки и фотография дома, которого давно не существовало.'],['Глава 2. Чужой почерк','Почерк совпадал с записями в дневнике деда. Но дата на письме была на двадцать лет позже его смерти.'],['Глава 3. Последний ключ','За рамой фотографии обнаружился маленький ключ. На его бородке были выгравированы инициалы, которых Ник никогда прежде не видел.']]},
{id:4,title:'За горизонтом',author:'YourDreamReader Studio',genre:'Приключения',emoji:'🧭',tone:'c4',desc:'Путешествие к острову, которого нет ни на одной карте.',chapters:[['Глава 1. Карта','Карта досталась Лее от капитана. На ней не было берегов — только компасная роза и надпись: «Смотри туда, где заканчивается привычный путь».'],['Глава 2. Шторм','Море поднялось стеной. Когда ветер стих, на горизонте появился зелёный огонёк, которого не было на карте.'],['Глава 3. Остров','Песок под ногами светился, а следы вели вглубь острова. Лея поняла, что настоящее приключение только начинается.']]},
{id:5,title:'Тихий свет',author:'YourDreamReader Studio',genre:'Драма',emoji:'🕯️',tone:'',desc:'Тёплая история о семье, прощении и втором шансе.',chapters:[['Глава 1. Дом','После долгого отсутствия Саша вернулся в дом у реки. Всё было на своих местах, кроме старых часов, которые остановились в день его отъезда.'],['Глава 2. Разговор','Молчание оказалось тяжелее любых слов. За чашкой чая они впервые рассказали друг другу, чего боялись все эти годы.'],['Глава 3. Утро','Утром часы снова пошли. Саша открыл окно и впервые за долгое время почувствовал, что дома можно начать сначала.']]}
];
let state={};try{state=JSON.parse(localStorage.getItem('ydr')||'{}')||{}}catch(e){state={}}Object.assign(state,{name:state.name||'',lang:'Русский',style:state.style||'pink',font:Number(state.font)||19,favorites:Array.isArray(state.favorites)?state.favorites:[],progress:state.progress&&typeof state.progress==='object'?state.progress:{},lastChapter:state.lastChapter&&typeof state.lastChapter==='object'?state.lastChapter:{},done:!!state.done});let currentBook=null,currentChapter=0,filter='Все',returnPage='home',activePage='home';
function save(){try{localStorage.setItem('ydr',JSON.stringify(state))}catch(e){toast('Не удалось сохранить данные: память устройства заполнена')}}function el(id){return document.getElementById(id)}function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),1900)}
function setup(){el('view').innerHTML=`<div class="eyebrow">Добро пожаловать</div><div class="hero"><div style="font-size:36px">♡</div><h1>Твоя следующая любимая история</h1><p>Место, где оживают миры, чувства и воображение.</p><button class="pillbtn" onclick="page('library')">Открыть библиотеку →</button></div><div class="card"><h2>Настроим твою читальню</h2><p class="muted">Имя автора или псевдоним</p><input class="field" id="onname" placeholder="Например, Без имени автора" value="${esc(state.name)}"><p class="muted">Язык первого запуска</p><label class="choice"><input type="radio" name="lang" value="Русский" ${state.lang==='Русский'?'checked':''}>Русский</label><p class="muted">Язык приложения: русский (другие переводы пока не добавлены).</p><p class="muted">Объём тестовых новелл</p><label class="choice"><input type="radio" name="volume" value="full" ${!state.pilot?'checked':''}>Полные истории с финалом</label><label class="choice"><input type="radio" name="volume" value="pilot" ${state.pilot?'checked':''}>Пилотные версии по 3–5 глав</label><button class="primary" onclick="finishSetup()">Утвердить и продолжить 💗</button></div><p class="muted">Можно изменить настройки в любой момент.</p>`}
function finishSetup(){state.name=el('onname').value.trim()||'Без имени автора';state.lang='Русский';state.pilot=document.querySelector('input[name=volume]:checked').value==='pilot';state.done=true;save();page('home');toast('Твоя читальня готова 💗')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function page(p){activePage=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));if(!state.done&&p!=='settings'){setup();return}if(p==='home')home();if(p==='library')library();if(p==='favorites')favorites();if(p==='settings')settings();if(p==='profile')profile();applyStyle()}
function bookCard(b){let prog=state.progress[b.id]||0;return `<article class="book" onclick="detail(${b.id})"><div class="cover ${b.tone}">${b.emoji}</div><div class="bookinfo"><h3>${b.title}</h3><small>${b.genre} · ${b.chapters.length} главы</small><div class="tag">${prog>=b.chapters.length?'Прочитано':prog?`Читается · ${prog}/${b.chapters.length}`:'Новая история'}</div></div></article>`}
function home(){el('view').innerHTML=`<div class="eyebrow">${state.name||'Твоя читальня'}</div><div class="hero"><div class="eyebrow" style="color:#8b6078">YOUR DREAM READER</div><h1>Между строк — целый мир</h1><p>Выбирай настроение, открывай новую историю и сохраняй любимые моменты.</p><button class="pillbtn" onclick="page('library')">Выбрать историю →</button></div><div class="sectionhead"><h2>Жанры</h2><span class="muted">5 миров</span></div><div class="chips">${['Все',...genres].map(g=>`<button class="chip" onclick="filter='${g}';page('library')">${g}</button>`).join('')}</div><div class="sectionhead"><h2>Продолжить чтение</h2><button class="smallbtn" onclick="resumeReading()">Продолжить →</button></div><div class="sectionhead"><h2>Истории для тебя</h2><button class="smallbtn" onclick="page('library')">Все →</button></div><div class="grid">${books.slice(0,4).map(bookCard).join('')}</div>`}
function library(){el('view').innerHTML=`<div class="eyebrow">Коллекция историй</div><h1 style="margin:4px 0">Библиотека</h1><input class="field" id="q" placeholder="⌕  Найти историю или жанр" oninput="renderBooks()"><div class="chips">${['Все',...genres].map(g=>`<button class="chip ${filter===g?'active':''}" onclick="filter='${g}';library()">${g}</button>`).join('')}</div><div class="sectionhead"><h2>${filter==='Все'?'Все истории':filter}</h2><span class="muted">${books.filter(b=>filter==='Все'||b.genre===filter).length}</span></div><div class="grid" id="bookgrid">${books.filter(b=>filter==='Все'||b.genre===filter).map(bookCard).join('')}</div>`}
function renderBooks(){let q=el('q').value.toLowerCase();el('bookgrid').innerHTML=books.filter(b=>(filter==='Все'||b.genre===filter)&&(b.title+' '+b.genre+' '+b.desc).toLowerCase().includes(q)).map(bookCard).join('')||'<div class="empty">Ничего не найдено</div>'}
function favorites(){let a=books.filter(b=>state.favorites.includes(b.id));el('view').innerHTML=`<div class="eyebrow">Твоя коллекция</div><h1>Избранное ♡</h1>${a.length?`<div class="grid">${a.map(bookCard).join('')}</div>`:'<div class="empty">♡<p>Здесь будут истории, которые ты полюбишь.</p><button class="smallbtn" onclick="page(\'library\')">Найти историю</button></div>'}`}
function detail(id){currentBook=books.find(b=>b.id===id);if(!currentBook)return;returnPage=activePage;let b=currentBook;el('view').innerHTML=`<button class="back" onclick="page('${returnPage}')">← Назад</button><div class="hero" style="text-align:center"><div style="font-size:65px">${b.emoji}</div><div class="eyebrow" style="color:#8b6078">${b.genre}</div><h1>${b.title}</h1><p style="margin:auto">${b.desc}</p></div><div class="row between" style="margin:18px 0"><span class="muted">${b.chapters.length} главы · пилотная история</span><button class="smallbtn" onclick="toggleFav(${b.id})">${state.favorites.includes(b.id)?'♥ В избранном':'♡ В избранное'}</button></div><div class="progress"><i style="width:${(state.progress[b.id]||0)/b.chapters.length*100}%"></i></div><div class="sectionhead"><h2>Содержание</h2></div>${b.chapters.map((c,i)=>`<button class="chapterbtn" onclick="read(${b.id},${i})"><div class="row between"><b>${c[0]}</b><span>→</span></div><small class="muted">${i<(state.progress[b.id]||0)?'Прочитано':'Открыть главу'}</small></button>`).join('')}`}
function toggleFav(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();toast(state.favorites.includes(id)?'Добавлено в избранное':'Удалено из избранного');detail(id)}
function read(id,n){currentBook=books.find(b=>b.id===id);if(!currentBook||n<0||n>=currentBook.chapters.length)return;currentChapter=n;let c=currentBook.chapters[n];el('view').innerHTML=`<button class="back" onclick="detail(${id})">← К содержанию</button><div class="row between"><small class="muted">${currentBook.title}</small><small class="muted">${n+1} / ${currentBook.chapters.length}</small></div><div class="progress" style="margin:10px 0 18px"><i style="width:${(n+1)/currentBook.chapters.length*100}%"></i></div><article class="reader ${state.style==='dark'?'dark':state.style==='sepia'?'sepia':''}" style="font-size:${state.font}px"><div class="eyebrow" style="color:#bd83a1">${currentBook.genre}</div><h1>${c[0]}</h1><p>${c[1]}</p><p style="text-align:center;letter-spacing:8px;color:#c68da8">✧ ♡ ✧</p><div class="row between" style="margin-top:32px"><button class="smallbtn" onclick="${n>0?`read(${id},${n-1})`:'toast(\'Это первая глава\')'}">← Назад</button><button class="smallbtn" onclick="${n<currentBook.chapters.length-1?`advanceChapter(${id},${n})`:`finishBook(${id})`}">${n<currentBook.chapters.length-1?'Далее →':'Завершить ♡'}</button></div></article><p class="muted" style="text-align:center">Прогресс чтения сохраняется автоматически</p>`;state.lastChapter[id]=n;state.progress[id]=Math.max(state.progress[id]||0,n);if(n===currentBook.chapters.length-1&&state.progress[id]===currentBook.chapters.length-1)state.progress[id]=currentBook.chapters.length-1;save()}
function advanceChapter(id,n){state.progress[id]=Math.max(state.progress[id]||0,n+1);state.lastChapter[id]=n+1;save();read(id,n+1)}function finishBook(id){state.progress[id]=currentBook.chapters.length;state.lastChapter[id]=currentBook.chapters.length-1;save();toast('История прочитана! ♡');detail(id)}function resumeReading(){let ids=Object.keys(state.lastChapter);if(!ids.length){page('library');toast('Выбери историю, чтобы начать чтение');return}let id=Number(ids[ids.length-1]);read(id,Number(state.lastChapter[id])||0)}
function settings(){el('view').innerHTML=`<div class="eyebrow">Твоя атмосфера</div><h1>Настройки</h1><div class="card"><h3>Оформление приложения</h3><label class="choice"><input type="radio" name="style" value="pink" ${state.style==='pink'?'checked':''} onchange="setStyle(this.value)">Цветы и лепестки · розовый</label><label class="choice"><input type="radio" name="style" value="gradient" ${state.style==='gradient'?'checked':''} onchange="setStyle(this.value)">Нежный градиент</label><label class="choice"><input type="radio" name="style" value="dark" ${state.style==='dark'?'checked':''} onchange="setStyle(this.value)">Ночной монотонный</label></div><div class="card"><h3>Читалка</h3><p class="muted">Размер текста: <b id="fontval">${state.font}px</b></p><input type="range" min="16" max="26" value="${state.font}" style="width:100%;accent-color:#e9aeca" oninput="state.font=+this.value;el('fontval').textContent=this.value+'px';save()"><p class="muted">Предпросмотр</p><div class="reader" style="min-height:120px"><b>YourDreamReader</b><p style="font-size:${state.font}px">Твоя следующая любимая история ♡</p></div></div><div class="card"><h3>Язык приложения</h3><p class="muted">Сейчас доступен русский интерфейс и русскоязычные истории. Переключение на другие языки появится после добавления переводов.</p></div><div class="card"><h3>Данные приложения</h3><p class="muted">Сохрани резервную копию прогресса и избранного или восстанови её на этом устройстве.</p><button class="smallbtn" onclick="exportData()">Экспортировать данные</button><textarea id="backupdata" class="field" rows="3" placeholder="Для восстановления вставь сюда JSON-файл резервной копии"></textarea><button class="smallbtn" onclick="importData()">Восстановить копию</button></div><div class="card"><h3>Первоначальная настройка</h3><button class="smallbtn" onclick="restartSetup()">Изменить имя и предпочтения</button></div><button class="primary" onclick="toast('Настройки сохранены 💗')">Сохранить настройки</button>`}
function setStyle(v){state.style=v;save();applyStyle();toast('Оформление изменено')}function applyStyle(){document.body.style.background=state.style==='gradient'?'linear-gradient(145deg,#17131a,#332232)':'var(--bg)';document.body.classList.toggle('theme-dark',state.style==='dark')}function exportData(){let t=el('backupdata');t.value=JSON.stringify({app:'YourDreamReader',version:1,data:state},null,2);t.focus();t.select();toast('Резервная копия готова — скопируй текст')}function importData(){try{let x=JSON.parse(el('backupdata').value);let d=x.data||x;if(!d||typeof d!=='object'||!Array.isArray(d.favorites)||typeof d.progress!=='object')throw new Error();state={...state,...d};save();toast('Данные восстановлены');page('home')}catch(e){toast('Не удалось прочитать резервную копию')}}function restartSetup(){if(confirm('Вернуться к первоначальной настройке? Прогресс и избранное сохранятся.')){state.done=false;save();setup()}}
function profile(){el('view').innerHTML=`<div class="eyebrow">Творческая студия</div><h1>Профиль автора</h1><div class="card"><div style="font-size:42px">✦</div><label class="muted" for="profilename">Имя или псевдоним</label><input class="field" id="profilename" maxlength="40" value="${esc(state.name)}"><button class="smallbtn" onclick="saveProfile()">Сохранить имя</button><p class="muted">${state.lang}</p></div><div class="card"><div class="row between"><span>Историй в библиотеке</span><b>${books.length}</b></div><div class="row between"><span>В избранном</span><b>${state.favorites.length}</b></div><div class="row between"><span>Начато историй</span><b>${Object.keys(state.progress).length}</b></div></div><p class="muted">YourDreamReader Studio · версия 1.0.0</p>`}
function saveProfile(){state.name=el('profilename').value.trim()||'Без имени автора';save();toast('Профиль обновлён');profile()}function readerBack(){if(currentBook)detail(currentBook.id);else page('home')}
if(!state.done){setup()}else{page('home')}
</script></body></html>
